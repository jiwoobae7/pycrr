[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "pycrr"
version         = "0.1.0"
description     = "Fine-Gray competing risks regression with diagnostic inference in Python"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
authors         = [{ name = "Jiwoo Bae" }]
keywords        = ["survival analysis", "competing risks", "Fine-Gray", "statistics", "epidemiology"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "lifelines>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/<your-username>/pycrr"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pycrr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
